# Render pe deploy (Blueprint). Dashboard se banayi service mein bhi yehi
# Build / Start commands daalein. TypeScript dist/ mein build hota hai, is liye
# sirf "npm install" kaafi nahi. NODE_ENV=production pe npm devDependencies
# (typescript) chhod deta hai, is liye --include=dev
services:
  - type: web
    name: influencer-backend
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
